<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMW Precio Justo — Analizador de Ofertas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
    color: #e8ecf1; min-height: 100vh; padding: 20px;
  }
  .container { max-width: 820px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  h1 {
    font-size: 2rem;
    background: linear-gradient(90deg, #0066b1, #4a9fd8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .subtitle { color: #8892a6; font-size: 0.9rem; }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 24px; margin-bottom: 20px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 0.82rem; color: #a0aec0; margin-bottom: 6px; font-weight: 500; }
  select, input[type="number"] {
    width: 100%; padding: 12px 14px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; color: #e8ecf1; font-size: 1rem;
    outline: none; transition: border-color 0.2s;
  }
  select:focus, input[type="number"]:focus { border-color: #0066b1; }
  select option { background: #1a1f3a; }

  /* Checkbox custom */
  .checkbox-row {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    background: rgba(0,102,177,0.08);
    border: 1px solid rgba(0,102,177,0.25);
    border-radius: 10px;
    cursor: pointer;
    margin-top: 14px;
    transition: background 0.2s;
  }
  .checkbox-row:hover { background: rgba(0,102,177,0.15); }
  .checkbox-row input[type="checkbox"] {
    width: 20px; height: 20px; cursor: pointer;
    accent-color: #4a9fd8;
    margin: 0;
  }
  .checkbox-text { display: flex; flex-direction: column; gap: 2px; }
  .checkbox-title { font-size: 0.95rem; font-weight: 600; color: #e8ecf1; }
  .checkbox-hint { font-size: 0.78rem; color: #8892a6; }

  button {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #0066b1, #4a9fd8);
    border: none; border-radius: 12px; color: white;
    font-size: 1.05rem; font-weight: 600; cursor: pointer;
    margin-top: 16px; transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,102,177,0.4); }
  button:active { transform: translateY(0); }
  #result { display: none; }
  .verdict-box {
    text-align: center; padding: 26px 24px; border-radius: 16px;
    margin-bottom: 14px; border: 2px solid;
  }
  .verdict-box.secondary { padding: 20px 24px; margin-top: 14px; }
  .verdict-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.75; margin-bottom: 8px; }
  .verdict { font-size: 1.8rem; font-weight: 800; margin-bottom: 10px; }
  .verdict-box.secondary .verdict { font-size: 1.4rem; }
  .verdict-desc { font-size: 0.9rem; opacity: 0.9; line-height: 1.5; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  @media (max-width: 600px) { .stats { grid-template-columns: 1fr; } }
  .stat { background: rgba(0,0,0,0.2); padding: 14px 10px; border-radius: 10px; text-align: center; }
  .stat-label { font-size: 0.68rem; color: #8892a6; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .stat-value { font-size: 1.05rem; font-weight: 700; }
  .range { display: flex; justify-content: space-between; margin-top: 18px; gap: 10px; }
  @media (max-width: 600px) { .range { flex-direction: column; } }
  .range-item { flex: 1; text-align: center; background: rgba(0,0,0,0.15); padding: 14px; border-radius: 10px; }
  .range-item .label { font-size: 0.68rem; color: #8892a6; text-transform: uppercase; letter-spacing: 1px; }
  .range-item .value { font-size: 1.05rem; font-weight: 700; margin-top: 4px; }
  .notes {
    font-size: 0.85rem; color: #a0aec0; line-height: 1.7;
    margin-top: 16px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .notes strong { color: #c0c8d6; }
  .bar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; margin-top: 10px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
  .warning {
    background: rgba(240,173,78,0.12);
    border: 1px solid rgba(240,173,78,0.4);
    color: #f0ad4e; padding: 12px; border-radius: 8px;
    font-size: 0.82rem; margin-top: 12px; line-height: 1.5;
  }
  .info-box {
    background: rgba(0,102,177,0.12);
    border: 1px solid rgba(0,102,177,0.4);
    color: #7ab8e0; padding: 12px; border-radius: 8px;
    font-size: 0.82rem; margin-top: 12px; line-height: 1.5;
  }
  .section-title {
    font-size: 0.78rem; text-transform: uppercase; letter-spacing: 2px;
    color: #8892a6; margin: 20px 0 10px 0;
  }
  .section-title:first-child { margin-top: 0; }
  footer { text-align: center; color: #5a6478; font-size: 0.78rem; margin-top: 28px; line-height: 1.6; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>BMW Precio Justo</h1>
    <p class="subtitle">Analiza si una oferta concreta está bien, mal o por encima de mercado</p>
  </header>

  <div class="card">
    <div class="section-title">Datos del coche</div>
    <div class="grid">
      <div>
        <label>Serie</label>
        <select id="serie" onchange="updateModels()">
          <option value="3">Serie 3</option>
          <option value="4">Serie 4</option>
        </select>
      </div>
      <div>
        <label>Modelo</label>
        <select id="modelo"></select>
      </div>
      <div>
        <label>Año</label>
        <select id="anio"></select>
      </div>
      <div>
        <label>Kilómetros</label>
        <input type="number" id="km" placeholder="Ej: 80000" value="80000" min="0" max="300000">
      </div>
      <div>
        <label>Acabado</label>
        <select id="acabado">
          <option value="msport">M Sport</option>
          <option value="msportpro">M Sport Pro (solo 2022+)</option>
        </select>
      </div>
      <div>
        <label>Fecha objetivo de compra</label>
        <select id="fecha">
          <option value="2026">Oct 2026 (hoy)</option>
          <option value="2027">Oct 2027</option>
          <option value="2028" selected>Oct 2028</option>
          <option value="2029">Oct 2029</option>
        </select>
      </div>
    </div>

    <div class="section-title">Precio y origen</div>
    <div class="grid">
      <div style="grid-column: 1 / -1;">
        <label>Precio pedido por el vendedor (€)</label>
        <input type="number" id="precio" placeholder="Ej: 42000" value="42000" min="0">
      </div>
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="esEspana" checked>
      <div class="checkbox-text">
        <span class="checkbox-title">El coche es de España</span>
        <span class="checkbox-hint">Ajusta +12% los precios de referencia (mercado español vs alemán)</span>
      </div>
    </label>

    <button onclick="analizar()">🔍 Analizar oferta</button>
  </div>

  <div id="result"></div>

  <footer>
    Precios base: mercado alemán (mobile.de, AutoScout24) · Oct 2026<br>
    Ajuste España +12% · No incluye ITV, matriculación ni transporte si importas
  </footer>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// BASE DE DATOS: precios de mercado ALEMÁN Oct 2026
// Formato: { anio: [precio@60.000km, precio@100.000km] }
// ═══════════════════════════════════════════════════════════
const DB = {
  "3": {
    "320i": { 2022: [31000, 31000], 2019: [25000, 25000], 2015: [25000, 25000] },
    "330i": { 2022: [39000, 39000], 2019: [31000, 27000], 2015: [28000, 21000] },
    "340i": { 2022: [48000, 45000], 2019: [45000, 36000], 2015: [33000, 33000] }
  },
  "4": {
    "420i": { 2022: [34000, 34000], 2018: [26000, 26000], 2015: [26000, 26000] },
    "430i": { 2022: [39000, 35000], 2018: [33000, 25000], 2015: [28000, 25000] },
    "440i": { 2022: [42000, 42000], 2018: [42000, 31000], 2015: [33000, 30000] }
  }
};

const AÑOS = {
  "3": [2022, 2021, 2020, 2019, 2018, 2017, 2016, 2015],
  "4": [2022, 2021, 2020, 2019, 2018, 2017, 2016, 2015]
};

const MODELOS = {
  "3": ["320i", "330i", "340i"],
  "4": ["420i", "430i", "440i"]
};

const PERFIL = {
  "320i": { motor: 'B48', cv: 184, costeOp: 'Bajo',   presionSucesor: 'Alta (G50)' },
  "330i": { motor: 'B48', cv: 258, costeOp: 'Medio',  presionSucesor: 'Alta (G50)' },
  "340i": { motor: 'B58', cv: 374, costeOp: 'Alto',   presionSucesor: 'Alta (G50)' },
  "420i": { motor: 'B48', cv: 184, costeOp: 'Bajo',   presionSucesor: 'Media (i4 NA2)' },
  "430i": { motor: 'B48', cv: 245, costeOp: 'Medio',  presionSucesor: 'Media (i4 NA2)' },
  "440i": { motor: 'B58', cv: 374, costeOp: 'Alto',   presionSucesor: 'Media (i4 NA2)' }
};

// Factor de ajuste España vs Alemania
const FACTOR_ESPANA = 1.12;

// ═══════════════════════════════════════════════════════════
// FUNCIONES
// ═══════════════════════════════════════════════════════════

function updateModels() {
  const serie = document.getElementById('serie').value;

  const selectM = document.getElementById('modelo');
  selectM.innerHTML = '';
  MODELOS[serie].forEach(m => {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    selectM.appendChild(opt);
  });

  const selectA = document.getElementById('anio');
  selectA.innerHTML = '';
  AÑOS[serie].forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    selectA.appendChild(opt);
  });
}

function getYearData(serie, modelo, anio) {
  const data = DB[serie][modelo];
  const years = Object.keys(data).map(Number).sort((a,b) => a-b);
  if (years.includes(anio)) return data[anio];

  let lower = null, upper = null;
  for (const y of years) {
    if (y < anio) lower = y;
    if (y > anio && upper === null) upper = y;
  }
  if (lower === null) return data[years[0]];
  if (upper === null) return data[years[years.length-1]];

  const t = (anio - lower) / (upper - lower);
  return [
    data[lower][0] + (data[upper][0] - data[lower][0]) * t,
    data[lower][1] + (data[upper][1] - data[lower][1]) * t
  ];
}

function adjustForKm(base60, base100, km) {
  if (km <= 60000) {
    const extra = Math.min((60000 - km) / 10000 * 0.02, 0.10);
    return base60 * (1 + extra);
  } else if (km <= 100000) {
    const t = (km - 60000) / 40000;
    return base60 + (base100 - base60) * t;
  } else {
    const disc = Math.min((km - 100000) / 10000 * 0.03, 0.15);
    return base100 * (1 - disc);
  }
}

function getDepRate(anio) {
  if (anio >= 2022) return 0.12;
  if (anio >= 2018) return 0.09;
  return 0.06;
}

function getDepFactor(anio, fecha) {
  const yearsAhead = parseInt(fecha) - 2026;
  if (yearsAhead <= 0) return 1;
  return Math.pow(1 - getDepRate(anio), yearsAhead);
}

function formatPrice(n) {
  return new Intl.NumberFormat('es-ES', {
    style: 'currency', currency: 'EUR', maximumFractionDigits: 0
  }).format(n);
}

function scoreConfig(serie, modelo, anio, km, acabado, fecha) {
  const perfil = PERFIL[modelo];
  let score = 50;
  const razones = [];

  if (perfil.costeOp === 'Bajo')  { score += 12; razones.push('✅ Coste operativo bajo (B48)'); }
  if (perfil.costeOp === 'Medio') { score += 5;  razones.push('⚖️ Coste operativo medio (B48)'); }
  if (perfil.costeOp === 'Alto')  { score -= 10; razones.push('⚠️ Coste operativo alto (B58)'); }

  if (serie === '3') { score -= 8; razones.push('⚠️ Serie 3 G20: presión del nuevo G50'); }
  if (serie === '4') { score += 5; razones.push('✅ Serie 4 G22: sin sucesor ICE confirmado'); }

  const edadEnFecha = parseInt(fecha) - anio;
  if (edadEnFecha <= 4)      { score += 15; razones.push('✅ Muy moderno en la fecha objetivo'); }
  else if (edadEnFecha <= 6) { score += 8;  razones.push('✅ Moderno en la fecha objetivo'); }
  else if (edadEnFecha <= 8) { score += 0;  razones.push('⚖️ Edad media en la fecha objetivo'); }
  else if (edadEnFecha <= 10){ score -= 8;  razones.push('⚠️ Antiguo en la fecha objetivo'); }
  else                       { score -= 15; razones.push('🚫 Muy antiguo en la fecha objetivo'); }

  if (km <= 40000)       { score += 10; razones.push('✅ Kilometraje bajo'); }
  else if (km <= 70000)  { score += 5;  razones.push('✅ Kilometraje contenido'); }
  else if (km <= 100000) { score += 0;  razones.push('⚖️ Kilometraje medio'); }
  else if (km <= 130000) { score -= 8;  razones.push('⚠️ Kilometraje alto'); }
  else                   { score -= 15; razones.push('🚫 Kilometraje muy alto'); }

  if (perfil.cv >= 370)      { score += 8; razones.push('✅ Seis cilindros B58 (374cv)'); }
  else if (perfil.cv >= 240) { score += 3; razones.push('⚖️ Cuatro cilindros deportivo (245-258cv)'); }
  else                       { score -= 5; razones.push('⚠️ Motor de acceso (184cv)'); }

  if (acabado === 'msportpro' && anio >= 2022) { score += 5; razones.push('✅ M Sport Pro (equipamiento top)'); }
  else if (acabado === 'msportpro' && anio < 2022) { score -= 2; razones.push('⚠️ M Sport Pro no existía antes de 2022'); }

  const yearsAhead = parseInt(fecha) - 2026;
  if (yearsAhead >= 3) score -= 5;
  if (yearsAhead >= 4) score -= 5;

  score = Math.max(0, Math.min(100, score));
  return { score, razones };
}

// ═══════════════════════════════════════════════════════════
// ANÁLISIS PRINCIPAL
// ═══════════════════════════════════════════════════════════

function analizar() {
  const serie = document.getElementById('serie').value;
  const modelo = document.getElementById('modelo').value;
  const anio = parseInt(document.getElementById('anio').value);
  const km = parseInt(document.getElementById('km').value);
  const acabado = document.getElementById('acabado').value;
  const fecha = document.getElementById('fecha').value;
  const precioPedido = parseInt(document.getElementById('precio').value);
  const esEspana = document.getElementById('esEspana').checked;

  if (isNaN(km) || km < 0) { alert('Introduce un kilometraje válido.'); return; }
  if (isNaN(precioPedido) || precioPedido <= 0) { alert('Introduce el precio que te piden.'); return; }

  // ──────────────────────────────────────────────────────────
  // 1. CÁLCULO BASE (siempre en términos ALEMANES internamente)
  // ──────────────────────────────────────────────────────────
  const [base60, base100] = getYearData(serie, modelo, anio);
  let precioAjustado = adjustForKm(base60, base100, km);

  let warning = '';
  if (acabado === 'msportpro') {
    if (anio < 2022) {
      warning = 'El acabado M Sport Pro solo existe desde 2022. Para este año se ha tratado como M Sport estándar.';
    } else {
      precioAjustado *= 1.06;
    }
  }

  const depFactor = getDepFactor(anio, fecha);
  const precioHoyDE = precioAjustado;              // Alemán, hoy
  const precioFuturoDE = precioAjustado * depFactor; // Alemán, futuro
  const minDE = precioFuturoDE * 0.92;
  const maxDE = precioFuturoDE * 1.08;

  // ──────────────────────────────────────────────────────────
  // 2. NORMALIZAR EL PRECIO DEL USUARIO A ALEMÁN
  // Si es de España, el precio es +12% respecto a Alemania,
  // por lo que lo dividimos por 1.12 para compararlo.
  // ──────────────────────────────────────────────────────────
  const factorNormalizacion = esEspana ? (1 / FACTOR_ESPANA) : 1;
  const precioPedidoDE = precioPedido * factorNormalizacion;

  // ──────────────────────────────────────────────────────────
  // 3. COMPARAR (en términos alemanes, que es lo coherente)
  // ──────────────────────────────────────────────────────────
  const delta = (precioPedidoDE - precioFuturoDE) / precioFuturoDE;

  // ──────────────────────────────────────────────────────────
  // 4. VALORES PARA MOSTRAR (en la moneda del país del coche)
  // Si es España, multiplicamos los valores alemanes por 1.12
  // ──────────────────────────────────────────────────────────
  const factorMostrar = esEspana ? FACTOR_ESPANA : 1;
  const precioHoyMostrar = precioHoyDE * factorMostrar;
  const precioFuturoMostrar = precioFuturoDE * factorMostrar;
  const minMostrar = minDE * factorMostrar;
  const maxMostrar = maxDE * factorMostrar;

  // Veredicto sobre el precio
  let vPrecio, colorP, emojiP, descP;
  if (delta <= -0.15) {
    vPrecio = 'GANGAZO'; colorP = '#00a651'; emojiP = '🔥';
    descP = 'Precio muy por debajo de mercado. Verifica historial, accidentes y estado antes de comprar.';
  } else if (delta <= -0.05) {
    vPrecio = 'BUEN PRECIO'; colorP = '#7ac143'; emojiP = '✅';
    descP = 'Precio por debajo del valor de mercado. Buena compra si el estado es correcto.';
  } else if (delta <= 0.05) {
    vPrecio = 'PRECIO DE MERCADO'; colorP = '#f0ad4e'; emojiP = '⚖️';
    descP = 'Precio dentro del rango normal. Puedes intentar negociar a la baja.';
  } else if (delta <= 0.15) {
    vPrecio = 'POR ENCIMA'; colorP = '#e67e22'; emojiP = '⚠️';
    descP = 'Precio ligeramente por encima del mercado. Busca alternativas o negocia.';
  } else {
    vPrecio = 'SOBREPRECIO'; colorP = '#c0392b'; emojiP = '🚫';
    descP = 'Precio muy por encima del mercado. No recomendado salvo equipamiento excepcional.';
  }

  // Puntuación de configuración
  const { score, razones } = scoreConfig(serie, modelo, anio, km, acabado, fecha);

  let vConfig, colorC, emojiC, descC;
  if (score >= 75) {
    vConfig = 'EXCELENTE OPORTUNIDAD'; colorC = '#00a651'; emojiC = '🔥';
    descC = 'Esta configuración es de las mejores para tu objetivo.';
  } else if (score >= 60) {
    vConfig = 'BUENA OPORTUNIDAD'; colorC = '#7ac143'; emojiC = '✅';
    descC = 'Configuración sólida. Buena compra si el estado acompaña.';
  } else if (score >= 45) {
    vConfig = 'OPORTUNIDAD REGULAR'; colorC = '#f0ad4e'; emojiC = '⚖️';
    descC = 'Ni destacable ni mala. Solo si el precio está bien ajustado.';
  } else if (score >= 30) {
    vConfig = 'POCO RECOMENDABLE'; colorC = '#e67e22'; emojiC = '⚠️';
    descC = 'Hay opciones mejores por precio similar.';
  } else {
    vConfig = 'MALA OPORTUNIDAD'; colorC = '#c0392b'; emojiC = '🚫';
    descC = 'Configuración poco eficiente. Mejor busca otra combinación.';
  }

  const barColor = score >= 60 ? '#00a651' : score >= 45 ? '#f0ad4e' : '#c0392b';

  // Info sobre el ajuste aplicado
  const infoAjuste = esEspana
    ? `<div class="info-box">
        🇪🇸 <strong>Coche español detectado.</strong> Los precios de referencia mostrados incluyen el ajuste +12% (mercado español vs alemán). Tu precio se ha normalizado a alemán (÷1,12) para compararlo con la base de datos.
      </div>`
    : `<div class="info-box">
        🇩🇪 <strong>Coche alemán.</strong> Los precios de referencia son de mercado alemán sin ajuste.
      </div>`;

  const sufijoPais = esEspana ? 'ES' : 'DE';
  const etiquetaPais = esEspana ? 'España' : 'Alemania';

  // Render
  const result = document.getElementById('result');
  result.style.display = 'block';
  result.innerHTML = `
    <div class="card">
      ${infoAjuste}

      <div class="section-title">1 · Veredicto sobre el PRECIO</div>
      <div class="verdict-box" style="border-color:${colorP}; background:${colorP}15;">
        <div class="verdict-label">${emojiP} Análisis del precio pedido</div>
        <div class="verdict" style="color:${colorP};">${vPrecio}</div>
        <div class="verdict-desc">${descP}</div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Precio pedido</div>
          <div class="stat-value">${formatPrice(precioPedido)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Precio justo ${fecha} (${sufijoPais})</div>
          <div class="stat-value" style="color
