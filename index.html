<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMW Oportunidad — Analizador</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
    color: #e8ecf1; min-height: 100vh; padding: 20px;
  }
  .container { max-width: 820px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 28px; }
  h1 {
    font-size: 2rem;
    background: linear-gradient(90deg, #0066b1, #4a9fd8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .subtitle { color: #8892a6; font-size: 0.9rem; }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 24px; margin-bottom: 20px;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 0.82rem; color: #a0aec0; margin-bottom: 6px; font-weight: 500; }
  select, input {
    width: 100%; padding: 12px 14px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; color: #e8ecf1; font-size: 1rem;
    outline: none; transition: border-color 0.2s;
  }
  select:focus, input:focus { border-color: #0066b1; }
  select option { background: #1a1f3a; }
  button {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #0066b1, #4a9fd8);
    border: none; border-radius: 12px; color: white;
    font-size: 1.05rem; font-weight: 600; cursor: pointer;
    margin-top: 12px; transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,102,177,0.4); }
  button:active { transform: translateY(0); }
  #result { display: none; }
  .verdict-box {
    text-align: center; padding: 28px 24px; border-radius: 16px;
    margin-bottom: 18px; border: 2px solid;
  }
  .verdict-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.75; margin-bottom: 8px; }
  .verdict { font-size: 1.9rem; font-weight: 800; margin-bottom: 10px; }
  .verdict-desc { font-size: 0.92rem; opacity: 0.9; line-height: 1.5; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  @media (max-width: 600px) { .stats { grid-template-columns: 1fr; } }
  .stat { background: rgba(0,0,0,0.2); padding: 14px 10px; border-radius: 10px; text-align: center; }
  .stat-label { font-size: 0.7rem; color: #8892a6; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .stat-value { font-size: 1.15rem; font-weight: 700; }
  .range { display: flex; justify-content: space-between; margin-top: 18px; gap: 10px; }
  @media (max-width: 600px) { .range { flex-direction: column; } }
  .range-item { flex: 1; text-align: center; background: rgba(0,0,0,0.15); padding: 14px; border-radius: 10px; }
  .range-item .label { font-size: 0.7rem; color: #8892a6; text-transform: uppercase; letter-spacing: 1px; }
  .range-item .value { font-size: 1.1rem; font-weight: 700; margin-top: 4px; }
  .notes {
    font-size: 0.85rem; color: #a0aec0; line-height: 1.7;
    margin-top: 16px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .notes strong { color: #c0c8d6; }
  .bar {
    height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px;
    margin-top: 10px; overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
  .score-row { display: flex; justify-content: space-between; margin-top: 18px; gap: 12px; }
  .score-item { flex: 1; text-align: center; }
  .score-item .s-label { font-size: 0.7rem; color: #8892a6; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .score-item .s-value { font-size: 1rem; font-weight: 700; }
  .warning {
    background: rgba(240,173,78,0.12);
    border: 1px solid rgba(240,173,78,0.4);
    color: #f0ad4e; padding: 12px; border-radius: 8px;
    font-size: 0.82rem; margin-top: 12px; line-height: 1.5;
  }
  footer { text-align: center; color: #5a6478; font-size: 0.78rem; margin-top: 28px; line-height: 1.6; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>BMW Oportunidad</h1>
    <p class="subtitle">Analiza si una configuración es buena compra para la fecha objetivo</p>
  </header>

  <div class="card">
    <div class="grid">
      <div>
        <label>Serie</label>
        <select id="serie" onchange="updateModels()">
          <option value="3">Serie 3</option>
          <option value="4">Serie 4</option>
        </select>
      </div>
      <div>
        <label>Modelo</label>
        <select id="modelo"></select>
      </div>
      <div>
        <label>Año</label>
        <select id="anio"></select>
      </div>
      <div>
        <label>Kilómetros</label>
        <input type="number" id="km" placeholder="Ej: 80000" value="80000" min="0" max="300000">
      </div>
      <div>
        <label>Acabado</label>
        <select id="acabado">
          <option value="msport">M Sport</option>
          <option value="msportpro">M Sport Pro (solo 2022+)</option>
        </select>
      </div>
      <div>
        <label>Fecha objetivo de compra</label>
        <select id="fecha">
          <option value="2026">Oct 2026 (hoy)</option>
          <option value="2027">Oct 2027</option>
          <option value="2028" selected>Oct 2028</option>
          <option value="2029">Oct 2029</option>
        </select>
      </div>
    </div>
    <button onclick="analizar()">🔍 Analizar oportunidad</button>
  </div>

  <div id="result"></div>

  <footer>
    Precios basados en mercado alemán (mobile.de, AutoScout24) · Oct 2026<br>
    No incluye costes de importación a España (ITV, matriculación, transporte)
  </footer>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// BASE DE DATOS: precios de mercado Oct 2026 (Alemania)
// Formato: { anio: [precio@60.000km, precio@100.000km] }
// ═══════════════════════════════════════════════════════════
const DB = {
  "3": {
    "320i": { 2022: [31000, 31000], 2019: [25000, 25000], 2015: [25000, 25000] },
    "330i": { 2022: [39000, 39000], 2019: [31000, 27000], 2015: [28000, 21000] },
    "340i": { 2022: [48000, 45000], 2019: [45000, 36000], 2015: [33000, 33000] }
  },
  "4": {
    "420i": { 2022: [34000, 34000], 2018: [26000, 26000], 2015: [26000, 26000] },
    "430i": { 2022: [39000, 35000], 2018: [33000, 25000], 2015: [28000, 25000] },
    "440i": { 2022: [42000, 42000], 2018: [42000, 31000], 2015: [33000, 30000] }
  }
};

// Años válidos por serie (para el desplegable)
const AÑOS = {
  "3": [2022, 2021, 2020, 2019, 2018, 2017, 2016, 2015],
  "4": [2022, 2021, 2020, 2019, 2018, 2017, 2016, 2015]
};

const MODELOS = {
  "3": ["320i", "330i", "340i"],
  "4": ["420i", "430i", "440i"]
};

// ═══════════════════════════════════════════════════════════
// PERFIL DE CADA MODELO (para puntuar oportunidad)
// B48 = 4 cilindros (económico) · B58 = 6 cilindros (caro)
// ═══════════════════════════════════════════════════════════
const PERFIL = {
  "320i": { motor: 'B48', cv: 184, costeOp: 'Bajo',   presionSucesor: 'Alta (G50)' },
  "330i": { motor: 'B48', cv: 258, costeOp: 'Medio',  presionSucesor: 'Alta (G50)' },
  "340i": { motor: 'B58', cv: 374, costeOp: 'Alto',   presionSucesor: 'Alta (G50)' },
  "420i": { motor: 'B48', cv: 184, costeOp: 'Bajo',   presionSucesor: 'Media (i4 NA2)' },
  "430i": { motor: 'B48', cv: 245, costeOp: 'Medio',  presionSucesor: 'Media (i4 NA2)' },
  "440i": { motor: 'B58', cv: 374, costeOp: 'Alto',   presionSucesor: 'Media (i4 NA2)' }
};

// ═══════════════════════════════════════════════════════════
// FUNCIONES
// ═══════════════════════════════════════════════════════════

function updateModels() {
  const serie = document.getElementById('serie').value;

  // Modelos
  const selectM = document.getElementById('modelo');
  selectM.innerHTML = '';
  MODELOS[serie].forEach(m => {
    const opt = document.createElement('option');
    opt.value = m; opt.textContent = m;
    selectM.appendChild(opt);
  });

  // Años
  const selectA = document.getElementById('anio');
  selectA.innerHTML = '';
  AÑOS[serie].forEach(a => {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a;
    selectA.appendChild(opt);
  });
}

// Interpola precios para años sin dato exacto
function getYearData(serie, modelo, anio) {
  const data = DB[serie][modelo];
  const years = Object.keys(data).map(Number).sort((a,b) => a-b);
  if (years.includes(anio)) return data[anio];

  let lower = null, upper = null;
  for (const y of years) {
    if (y < anio) lower = y;
    if (y > anio && upper === null) upper = y;
  }
  if (lower === null) return data[years[0]];
  if (upper === null) return data[years[years.length-1]];

  const t = (anio - lower) / (upper - lower);
  return [
    data[lower][0] + (data[upper][0] - data[lower][0]) * t,
    data[lower][1] + (data[upper][1] - data[lower][1]) * t
  ];
}

// Ajuste por kilómetros
function adjustForKm(base60, base100, km) {
  if (km <= 60000) {
    const extra = Math.min((60000 - km) / 10000 * 0.02, 0.10);
    return base60 * (1 + extra);
  } else if (km <= 100000) {
    const t = (km - 60000) / 40000;
    return base60 + (base100 - base60) * t;
  } else {
    const disc = Math.min((km - 100000) / 10000 * 0.03, 0.15);
    return base100 * (1 - disc);
  }
}

// Depreciación anual según año del coche
function getDepRate(anio) {
  if (anio >= 2022) return 0.12;
  if (anio >= 2018) return 0.09;
  return 0.06;
}

// Factor de depreciación acumulada hasta la fecha objetivo
function getDepFactor(anio, fecha) {
  const yearsAhead = parseInt(fecha) - 2026;
  if (yearsAhead <= 0) return 1;
  return Math.pow(1 - getDepRate(anio), yearsAhead);
}

function formatPrice(n) {
  return new Intl.NumberFormat('es-ES', {
    style: 'currency', currency: 'EUR', maximumFractionDigits: 0
  }).format(n);
}

// ═══════════════════════════════════════════════════════════
// PUNTUACIÓN DE OPORTUNIDAD (0-100)
// ═══════════════════════════════════════════════════════════
function scoreOportunidad(serie, modelo, anio, km, acabado, fecha) {
  const perfil = PERFIL[modelo];
  let score = 50; // base
  const razones = [];

  // 1. Coste operativo
  if (perfil.costeOp === 'Bajo')  { score += 12; razones.push('✅ Coste operativo bajo (B48)'); }
  if (perfil.costeOp === 'Medio') { score += 5;  razones.push('⚖️ Coste operativo medio (B48)'); }
  if (perfil.costeOp === 'Alto')  { score -= 10; razones.push('⚠️ Coste operativo alto (B58)'); }

  // 2. Presión del sucesor
  if (serie === '3') { score -= 8; razones.push('⚠️ Serie 3 G20: presión del nuevo G50'); }
  if (serie === '4') { score += 5; razones.push('✅ Serie 4 G22: sin sucesor ICE confirmado'); }

  // 3. Año del coche (modernidad relativa en la fecha objetivo)
  const edadEnFecha = parseInt(fecha) - anio;
  if (edadEnFecha <= 4)      { score += 15; razones.push('✅ Muy moderno en la fecha objetivo'); }
  else if (edadEnFecha <= 6) { score += 8;  razones.push('✅ Moderno en la fecha objetivo'); }
  else if (edadEnFecha <= 8) { score += 0;  razones.push('⚖️ Edad media en la fecha objetivo'); }
  else if (edadEnFecha <= 10){ score -= 8;  razones.push('⚠️ Antiguo en la fecha objetivo'); }
  else                       { score -= 15; razones.push('🚫 Muy antiguo en la fecha objetivo'); }

  // 4. Kilómetros
  if (km <= 40000)       { score += 10; razones.push('✅ Kilometraje bajo'); }
  else if (km <= 70000)  { score += 5;  razones.push('✅ Kilometraje contenido'); }
  else if (km <= 100000) { score += 0;  razones.push('⚖️ Kilometraje medio'); }
  else if (km <= 130000) { score -= 8;  razones.push('⚠️ Kilometraje alto'); }
  else                   { score -= 15; razones.push('🚫 Kilometraje muy alto'); }

  // 5. Potencia / atractivo
  if (perfil.cv >= 370)      { score += 8; razones.push('✅ Seis cilindros B58 (374cv)'); }
  else if (perfil.cv >= 240) { score += 3; razones.push('⚖️ Cuatro cilindros deportivo (245-258cv)'); }
  else                       { score -= 5; razones.push('⚠️ Motor de acceso (184cv)'); }

  // 6. Acabado
  if (acabado === 'msportpro' && anio >= 2022) { score += 5; razones.push('✅ M Sport Pro (equipamiento top)'); }
  else if (acabado === 'msportpro' && anio < 2022) { score -= 2; razones.push('⚠️ M Sport Pro no existía antes de 2022'); }

  // 7. Penalización por fecha lejana (más incertidumbre)
  const yearsAhead = parseInt(fecha) - 2026;
  if (yearsAhead >= 3) score -= 5;
  if (yearsAhead >= 4) score -= 5;

  // Clamp
  score = Math.max(0, Math.min(100, score));

  return { score, razones };
}

// ═══════════════════════════════════════════════════════════
// ANÁLISIS PRINCIPAL
// ═══════════════════════════════════════════════════════════

function analizar() {
  const serie = document.getElementById('serie').value;
  const modelo = document.getElementById('modelo').value;
  const anio = parseInt(document.getElementById('anio').value);
  const km = parseInt(document.getElementById('km').value);
  const acabado = document.getElementById('acabado').value;
  const fecha = document.getElementById('fecha').value;

  if (isNaN(km) || km < 0) {
    alert('Introduce un kilometraje válido.');
    return;
  }

  // 1. Base según año y modelo
  const [base60, base100] = getYearData(serie, modelo, anio);

  // 2. Ajuste por kilómetros
  let precioAjustado = adjustForKm(base60, base100, km);

  // 3. Ajuste por acabado
  let warning = '';
  if (acabado === 'msportpro') {
    if (anio < 2022) {
      warning = 'El acabado M Sport Pro solo existe desde 2022. Para este año se ha tratado como M Sport estándar.';
    } else {
      precioAjustado *= 1.06;
    }
  }

  // 4. Precio futuro estimado
  const depFactor = getDepFactor(anio, fecha);
  const precioFuturo = precioAjustado * depFactor;
  const precioHoy = precioAjustado;

  // 5. Rango razonable
  const min = precioFuturo * 0.92;
  const max = precioFuturo * 1.08;

  // 6. Puntuación de oportunidad
  const { score, razones } = scoreOportunidad(serie, modelo, anio, km, acabado, fecha);

  // 7. Veredicto según score
  let verdict, color, emoji, desc;
  if (score >= 75) {
    verdict = 'EXCELENTE OPORTUNIDAD'; color = '#00a651'; emoji = '🔥';
    desc = 'Esta configuración es de las mejores que puedes encontrar para tu objetivo.';
  } else if (score >= 60) {
    verdict = 'BUENA OPORTUNIDAD'; color = '#7ac143'; emoji = '✅';
    desc = 'Configuración sólida. Buena compra si el estado y el historial acompañan.';
  } else if (score >= 45) {
    verdict = 'OPORTUNIDAD REGULAR'; color = '#f0ad4e'; emoji = '⚖️';
    desc = 'Ni destacable ni mala. Solo si el precio final está bien ajustado.';
  } else if (score >= 30) {
    verdict = 'POCO RECOMENDABLE'; color = '#e67e22'; emoji = '⚠️';
    desc = 'Hay opciones mejores por precio similar. Solo si encuentras una unidad excepcional.';
  } else {
    verdict = 'MALA OPORTUNIDAD'; color = '#c0392b'; emoji = '🚫';
    desc = 'Configuración poco eficiente para tu objetivo. Mejor busca otra combinación.';
  }

  // 8. Barra de score
  const barColor = score >= 60 ? '#00a651' : score >= 45 ? '#f0ad4e' : '#c0392b';

  // 9. Render
  const result = document.getElementById('result');
  result.style.display = 'block';
  result.innerHTML = `
    <div class="card">
      <div class="verdict-box" style="border-color:${color}; background:${color}15;">
        <div class="verdict-label">${emoji} Veredicto de oportunidad</div>
        <div class="verdict" style="color:${color};">${verdict}</div>
        <div class="verdict-desc">${desc}</div>
        <div class="bar"><div class="bar-fill" style="width:${score}%; background:${barColor};"></div></div>
        <div style="font-size:0.8rem; color:#8892a6; margin-top:8px;">Puntuación: ${score}/100</div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Precio hoy (${2026})</div>
          <div class="stat-value">${formatPrice(precioHoy)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Precio ${fecha}</div>
          <div class="stat-value" style="color:${color};">${formatPrice(precioFuturo)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Deprec. est.</div>
          <div class="stat-value">${((1-depFactor)*100).toFixed(0)}%</div>
        </div>
      </div>

      <div class="range">
        <div class="range-item">
          <div class="label">Mínimo razonable</div>
          <div class="value">${formatPrice(min)}</div>
        </div>
        <div class="range-item">
          <div class="label">Máximo razonable</div>
          <div class="value">${formatPrice(max)}</div>
        </div>
      </div>

      <div class="notes">
        <strong>Configuración:</strong> BMW ${modelo} (Serie ${serie}) · ${anio} · ${km.toLocaleString('es-ES')} km · ${acabado==='msportpro'?'M Sport Pro':'M Sport'}<br>
        <strong>Motor:</strong> ${PERFIL[modelo].motor} · ${PERFIL[modelo].cv} cv · Coste operativo ${PERFIL[modelo].costeOp.toLowerCase()}<br>
        <strong>Presión de sucesor:</strong> ${PERFIL[modelo].presionSucesor}<br>
        <strong>Fecha objetivo:</strong> ${fecha==='2026'?'Hoy (Oct 2026)':'Oct '+fecha}
      </div>

      <div class="notes">
        <strong>Razones del veredicto:</strong><br>
        ${razones.map(r => '· ' + r).join('<br>')}
      </div>

      ${warning ? `<div class="warning">⚠️ ${warning}</div>` : ''}
    </div>
  `;

  result.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Inicializar
updateModels();
</script>
</body>
</html>
